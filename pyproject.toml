[project]
name = "aphasia-trainer-rl"
version = "0.1.0"
description = "RL therapist agent for an aphasia picture-naming practice trainer (Triangle AI Hackathon)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "sb3-contrib>=2.4",
    "torch>=2.3",
    "tensorboard>=2.21.0",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
grpo = [
    "tinker==0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "wordfreq>=3.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
