[project]
name = "aphasia-trainer-rl"
version = "0.1.0"
description = "RL therapist agent for an aphasia picture-naming practice trainer (Triangle AI Hackathon)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "sb3-contrib>=2.4",
    "torch>=2.3",
    "tensorboard>=2.21.0",
    "matplotlib>=3.11.2",
    "python-multipart>=0.0.9",
    "psstdata>=1.0.1",
    "cmudict>=1.1.3",
    "sentence-transformers>=6.2.0",
    "pandas>=3.1.1",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.5",
    "nltk>=3.10.4",
    "better-profanity>=0.7.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
grpo = [
    "tinker==0.35.0",
]
# Language-model policy and DITTO training. Versions pinned after the train/save/reload smoke test
# (training/smoke.py) passed on Apple MPS with torch 2.15.0.
llm = [
    "accelerate==1.15.0",
    "peft==0.21.2",
    "transformers==5.22.2",
]
# Local pretrained speech recognition (CPU, no API key). PyAV, bundled with it, decodes browser audio.
speech = [
    "faster-whisper==1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "wordfreq>=3.1.1",
    "playwright>=1.64.1",
    "imageio-ffmpeg>=0.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: builds the lexicon embeddings (about 30 s on first run)"]

[tool.uv]
package = false
