<title>CueAgain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a top bar switches between two products in one page. Patient = one big tablet card, one
   action at a time. Clinician = caseload rail + patient page (summary first, then detail). */
:root {
  --bg: #eef3f4; --surface: #ffffff; --surface-2: #f6f9fa; --ink: #13222a; --muted: #57686f; --line: #d5e0e3;
  --accent: #0b6b67; --accent-ink: #ffffff; --accent-soft: #d9eeec;
  --hint: #8a5300; --hint-bg: #fff1d6; --good: #17703f; --good-bg: #e1f3e7; --bad: #a93434; --bad-bg: #fbe6e5;
  --warn: #8a5300; --warn-bg: #fff1d6;
  --c-sound: #3567b0; --c-word: #c4571b; --c-none: #8b949b; --c-hint: #d39b2a;
  --shadow: 0 1px 2px rgba(19, 34, 42, .06), 0 6px 18px rgba(19, 34, 42, .06);
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f181c; --surface: #16232a; --surface-2: #1b2b33; --ink: #e5eef0; --muted: #9db0b6; --line: #2a3d45;
  --accent: #4fc3b9; --accent-ink: #062523; --accent-soft: #173f3c;
  --hint: #f5c46b; --hint-bg: #3a2d12; --good: #6fd39a; --good-bg: #14361f; --bad: #f19590; --bad-bg: #3d1c1c;
  --warn: #f5c46b; --warn-bg: #3a2d12; --c-sound: #79a6ec; --c-word: #f0915a; --c-none: #8d9aa1; --c-hint: #e3b459;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f181c; --surface: #16232a; --surface-2: #1b2b33; --ink: #e5eef0; --muted: #9db0b6; --line: #2a3d45;
  --accent: #4fc3b9; --accent-ink: #062523; --accent-soft: #173f3c;
  --hint: #f5c46b; --hint-bg: #3a2d12; --good: #6fd39a; --good-bg: #14361f; --bad: #f19590; --bad-bg: #3d1c1c;
  --warn: #f5c46b; --warn-bg: #3a2d12; --c-sound: #79a6ec; --c-word: #f0915a; --c-none: #8d9aa1; --c-hint: #e3b459;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; margin: 0 }
h2 { font-size: 1.1rem } h3 { font-size: .95rem }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }
.mono { font-family: var(--f-mono); font-size: .8rem }
.muted { color: var(--muted) } .small { font-size: .85rem }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap }
.brand { font-weight: 700; font-size: 1.15rem; letter-spacing: .01em; display: flex; align-items: baseline; gap: 8px }
.brand b { color: var(--accent) }
.sim-badge { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-left: auto }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-weight: 700; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 4px; font-size: .85rem; text-decoration: underline }

/* shared pieces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 700; white-space: nowrap }
.pill.good { background: var(--good-bg); color: var(--good) } .pill.bad { background: var(--bad-bg); color: var(--bad) }
.pill.warn { background: var(--warn-bg); color: var(--warn) } .pill.info { background: var(--accent-soft); color: var(--accent) }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px) }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }

/* ---------- PATIENT TABLET ---------- */
.tablet-stage { display: grid; gap: 14px; justify-items: center; padding-block: 22px 40px }
.tablet-meta { width: min(760px, 100%); display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.tablet-meta select { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 4px 8px }
.tablet { width: min(760px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 36px); min-height: 540px; display: flex; flex-direction: column; gap: 18px }
.t-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.t-greet { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 700 }
.t-big { font-size: clamp(1.15rem, 3vw, 1.4rem) }
.t-center { display: grid; justify-items: center; text-align: center; gap: 18px; margin-block: auto }
.go { font-size: 1.5rem; font-weight: 700; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink); padding: 18px 40px; min-width: 240px }
.go.secondary { background: var(--surface-2); color: var(--ink); border: 2px solid var(--line) }
.pic { width: min(300px, 70vw); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; background: var(--surface-2); border-radius: 22px; border: 1px solid var(--line) }
.pic img { width: 74%; height: 74% }
.progress { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center }
.progress i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block }
.progress i.ok { background: var(--good) } .progress i.help { background: var(--c-hint) } .progress i.miss { background: var(--c-none) } .progress i.now { outline: 3px solid var(--accent); outline-offset: 2px }
.hintbox { background: var(--hint-bg); color: var(--hint); border-radius: 14px; padding: 12px 18px; font-size: 1.3rem; font-weight: 700; max-width: 560px }
.okbox { background: var(--good-bg); color: var(--good); border-radius: 14px; padding: 12px 18px; font-size: 1.35rem; font-weight: 700 }
.answer-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center }
.mic { font-size: 1.35rem; font-weight: 700; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); padding: 16px 30px }
.helper { width: 100%; border-top: 2px dashed var(--line); padding-top: 14px; display: grid; gap: 10px }
.helper .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center }
.helper input { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); min-width: 0; width: min(320px, 100%) }
.hb { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; line-height: 1.2 }
.hb small { display: block; font-weight: 400; color: var(--muted) }
.hb.ok { border-color: var(--good); color: var(--good) }
.t-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }
.levelchip { font-weight: 700; color: var(--accent) }
.overlay { position: fixed; inset: 0; background: rgba(10, 20, 24, .55); display: grid; place-items: center; z-index: 15; padding: 16px }
.sumgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100% }
.sumgrid div { background: var(--surface-2); border-radius: 14px; padding: 14px; text-align: center }
.sumgrid b { display: block; font-size: 2rem }

/* ---------- CLINICIAN ---------- */
.clin { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; padding-block: 18px 40px; align-items: start }
.rail { display: grid; gap: 10px; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)) }
.prow { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; display: grid; gap: 6px; width: 100% }
.prow[aria-current="true"] { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent) }
.prow .nm { display: flex; justify-content: space-between; gap: 8px; font-weight: 700 }
.meter { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line) }
.meter span { display: block; height: 100% ; background: var(--accent) }
.flags { display: flex; gap: 6px; flex-wrap: wrap }
.main { display: grid; gap: 16px; min-width: 0 }
.phead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap }
.phead h1 { font-size: 1.6rem }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.kpi .v { font-size: 1.7rem; font-weight: 700 }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px }
.chart svg { width: 100%; height: auto; display: block }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted) }
.legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px }
.stack { display: flex; height: 16px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line) }
.stack span { display: block; height: 100% }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .9rem }
.tablebox { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: .88rem }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
tr.sel td { background: var(--accent-soft) }
.sess { display: flex; gap: 6px; flex-wrap: wrap }
.sess button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 9px; font-size: .82rem }
.sess button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.sess button.early { border-color: var(--bad) }
.over select { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 2px 4px; font-size: .82rem }
.over .done { color: var(--accent); font-weight: 700; font-size: .82rem }
textarea { width: 100%; min-height: 86px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); resize: vertical }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: .85rem }
.proposal { display: grid; gap: 8px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 12px }
.proposal label { display: flex; gap: 10px; align-items: flex-start }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.form label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted) }
.form select, .form input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface-2); color: var(--ink); min-width: 0 }
.words { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.word { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: .85rem }
.log { display: grid; gap: 8px; font-size: .88rem }
.log div { border-left: 3px solid var(--line); padding-left: 10px }
.teach-result { border-radius: 12px; background: var(--good-bg); color: var(--ink); padding: 14px; display: grid; gap: 8px }
.big-delta { font-size: 1.6rem; font-weight: 700; color: var(--good) }
.foot { padding-block: 10px 30px; font-size: .8rem; color: var(--muted) }

@media (max-width: 980px) { .clin { grid-template-columns: 1fr } .rail { position: static; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) } .two { grid-template-columns: 1fr } }
@media (max-width: 620px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } .form { grid-template-columns: 1fr } .sumgrid { grid-template-columns: 1fr } .seg { margin-left: 0 } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<header class="top"><div class="wrap">
  <div class="brand"><span>Cue<b>Again</b></span><span class="sim-badge">Prototype · simulated patients</span></div>
  <div class="seg" role="group" aria-label="View">
    <button id="nav-patient" aria-pressed="false">Patient tablet</button>
    <button id="nav-clinician" aria-pressed="true">Clinician</button>
  </div>
</div></header>

<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<div id="overlay" class="overlay" hidden></div>

<script>
const MOCK = /*__MOCK_DATA__*/null;
const ITEMS = /*__ITEMS__*/null;
const PICS = /*__PICTURES__*/null;

/* ---------- state ---------- */
const HINT_LABEL = { none: "No hint", first_sound: "First sound", first_letter: "First letter", sentence_frame: "Sentence frame", semantic: "Meaning hint" };
const ERR_LABEL = { sound: "Sound error", meaning: "Wrong word", no_response: "No answer", correct: "Correct" };
const ORDER_LABEL = { match_error: "Match the hint to the error", first_sound_first: "First sound first", meaning_first: "Meaning hints first", least_help: "Least help first" };
const LADDERS = {
  match_error: { sound: ["first_sound", "first_letter", "sentence_frame"], meaning: ["semantic", "sentence_frame", "first_sound"], no_response: ["sentence_frame", "semantic", "first_sound"] },
  first_sound_first: { _: ["first_sound", "first_letter", "semantic"] },
  meaning_first: { _: ["semantic", "sentence_frame", "first_sound"] },
  least_help: { _: ["sentence_frame", "first_letter", "first_sound"] },
};
const S = {
  view: "clinician", sel: "maria", tablet: "maria",
  patients: structuredClone(MOCK.patients),
  log: {}, overrides: {}, taught: {}, openSession: null, proposal: null,
  run: null,
};
for (const p of S.patients) { S.log[p.id] = [{ when: "Nov 1", who: "Dr. Patel, SLP", what: "Initial plan set after evaluation." }]; S.overrides[p.id] = []; }
const P = (id) => S.patients.find((p) => p.id === id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x) => (x == null ? "–" : Math.round(x * 100) + "%");
const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const $ = (id) => document.getElementById(id);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }

/* ---------- routing ---------- */
function setView(v) { S.view = v; if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v); render(); }
$("nav-patient").onclick = () => setView("patient");
$("nav-clinician").onclick = () => setView("clinician");
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v === "patient" || v === "clinician") { S.view = v; render(); } });
function render() {
  $("nav-patient").setAttribute("aria-pressed", S.view === "patient");
  $("nav-clinician").setAttribute("aria-pressed", S.view === "clinician");
  S.view === "patient" ? renderTablet() : renderClinician();
}

/* =====================================================================
   PATIENT TABLET
   One picture at a time. Wrong or stuck -> the smallest helpful hint, stronger on each retry
   (clinical cueing hierarchy). Last attempt -> show and say the word, repeat it, move on.
   Difficulty adapts to first-try success; 3 missed pictures in a row -> offer a break.
   ===================================================================== */
function tabletPlan() { return P(S.tablet).plan; }
function pickItem(level, seen) {
  const pool = ITEMS.filter((i) => i.tier === level);
  const fresh = pool.filter((i) => !seen.has(i.exercise_id));
  const from = fresh.length ? fresh : pool;
  return from[Math.floor(Math.random() * from.length)];
}
function startRun() {
  const plan = tabletPlan();
  S.run = { level: plan.level, n: plan.pictures_per_session, done: [], seen: new Set(), item: null, attempt: 0,
            hints: [], lastError: null, state: "ask", missStreak: 0, firstTry: [], levelMsg: "", typed: "" };
  nextPicture();
}
function nextPicture() {
  const r = S.run;
  if (r.done.length >= r.n) { r.state = "end"; finishRun(); return renderTablet(); }
  r.item = pickItem(r.level, r.seen); r.seen.add(r.item.exercise_id);
  r.attempt = 0; r.hints = []; r.lastError = null; r.state = "ask"; r.typed = "";
  renderTablet();
}
function ladderFor(errorType) {
  const L = LADDERS[tabletPlan().hint_order] || LADDERS.match_error;
  return L[errorType] || L._ || LADDERS.match_error.no_response;
}
function answer(result) {            // result: "correct" | "sound" | "meaning" | "no_response"
  const r = S.run, plan = tabletPlan();
  r.attempt += 1;
  if (result === "correct") {
    r.state = "correct";
    recordPicture(true);
  } else {
    r.lastError = result;
    if (r.attempt >= plan.max_attempts) { r.state = "model"; recordPicture(false); }
    else {
      const ladder = ladderFor(r.hints.length ? r.firstError : result);
      if (!r.hints.length) r.firstError = result;
      r.hints.push(ladder[Math.min(r.hints.length, ladder.length - 1)]);
      r.state = "hint";
    }
  }
  renderTablet();
}
function recordPicture(named) {
  const r = S.run;
  const firstTry = named && r.attempt === 1;
  r.done.push({ word: r.item.preferred_name, level: r.level, named, firstTry, hints: [...r.hints], error: r.firstError || r.lastError });
  r.firstTry.push(firstTry);
  r.missStreak = named ? 0 : r.missStreak + 1;
  // adapt difficulty on first-try success over the last 4 pictures
  const last = r.firstTry.slice(-4); r.levelMsg = "";
  if (last.length === 4 && last.every(Boolean) && r.level < 3) { r.level += 1; r.firstTry = []; r.levelMsg = "Nice work. The next pictures are a bit harder."; }
  else if (last.length >= 3 && last.slice(-3).filter(Boolean).length === 0 && r.level > 1) { r.level -= 1; r.firstTry = []; r.levelMsg = "Let's try some easier pictures for a while."; }
}
function checkTyped() {
  const r = S.run, said = r.typed.trim().toLowerCase();
  if (!said) return;
  const names = [r.item.preferred_name, ...(r.item.accepted_alternatives || [])].map((s) => s.toLowerCase());
  if (names.includes(said)) answer("correct");
  else { r.state = "classify"; renderTablet(); }
}
function finishRun() {
  const r = S.run, p = P(S.tablet);
  const n = r.done.length, solo = r.done.filter((d) => d.firstTry).length, helped = r.done.filter((d) => d.named && !d.firstTry).length;
  const trials = r.done.map((d) => ({ word: d.word, level: d.level, hint: d.hints[0] || "none", correct: d.named, error: d.named ? "correct" : d.error || "no_response",
    seconds: 4, review: false, reason: d.hints.length ? `Hints given: ${d.hints.map((h) => HINT_LABEL[h].toLowerCase()).join(", ")}.` : "Named on the first try." }));
  p.sessions.push({ date: "2026-11-07", live: true, pictures: n, named_without_hint: solo / n, named_with_hint: helped / n,
    errors: { sound: r.done.filter((d) => !d.named && d.error === "sound").length, wrong_word: r.done.filter((d) => !d.named && d.error === "meaning").length, no_answer: r.done.filter((d) => !d.named && (d.error === "no_response" || !d.error)).length },
    review_recall: null, mean_level: r.done.reduce((a, d) => a + d.level, 0) / n, ended_early: false, minutes: Math.round(n * 1.1), trials });
}
function renderTablet() {
  const p = P(S.tablet), plan = p.plan, r = S.run;
  const opts = S.patients.map((x) => `<option value="${x.id}" ${x.id === S.tablet ? "selected" : ""}>${esc(x.first)}'s tablet</option>`).join("");
  let body = "";
  if (!r) {
    body = `<div class="t-head"><div class="t-greet">Good morning, ${esc(p.first)}.</div></div>
      <div class="t-center">
        <div class="t-big">Today: about ${plan.session_minutes} minutes, ${plan.pictures_per_session} pictures.</div>
        <div class="muted">Look at each picture and say its name. Take your time.</div>
        <button class="go" id="t-start">Start</button>
        <div class="small muted">${esc(p.helper === "practises on his own" ? "Practising on your own today." : "Helper today: " + p.helper + ".")}</div>
      </div>`;
  } else if (r.state === "end") {

const AS_OF = new Date(MOCK.as_of + "T12:00:00");

function parseFeedback(p, text) {

      <div><b>${esc(t.rule)}.</b> Share of the AI's choices that follow your approach, on ${t.held_out_states} decisions from new simulated sessions it had not seen.</div>
      <div class="num">Everything else the AI does for ${esc(p.first)}: <b>${pct(t.other_unchanged)} unchanged</b>.</div>
      <div class="small muted num">Prototype note: this update was computed ahead of time from ${t.n_overrides} corrections of the same kind as yours, on James\'s simulated sessions (training takes seconds). In the ${after.length} simulated sessions after the update, a wrong word was followed by a meaning hint ${pct(t.cue_after_wrong_word_after.semantic || 0)} of the time; they now appear in the chart and session list.</div></div>`;
  } else if (done) {
    res = `<div class="proposal"><b>${n} correction${n === 1 ? "" : "s"} saved.</b><span class="small">They are added to ${esc(p.first)}'s examples and used in the next training run. A live update in this prototype is set up for James.</span></div>`;
  }
  return `<div class="card" style="display:grid;gap:10px;align-content:start">
    <h2>Teach the AI your approach</h2>
    <div class="small muted">Each "I'd do this differently" is an example of how you would treat ${esc(p.first)}. The AI learns from a handful of examples (a method called DITTO) and changes only where your examples apply.</div>
    <div class="num"><b>${n}</b> correction${n === 1 ? "" : "s"} saved${t && n < 3 && !done ? '<span class="small muted"> · 3 or more work best</span>' : ""}</div>
    <div><button class="btn primary" id="teach" ${n === 0 || done ? "disabled" : ""}>Teach the AI</button></div>
    ${res}
  </div>`;
}

/* ---- plan settings ---- */
function planCard(p) {
  const pl = p.plan;
  const sel = (id, opts, cur) => `<select id="${id}">${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(cur) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  return `<div class="card" style="display:grid;gap:12px;align-content:start">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2>Practice plan</h2><span class="small muted">Used by ${esc(p.first)}'s tablet from the next session</span></div>
    <div class="form">
      <label>Starting level ${sel("pl-level", [[1, "1 · easiest"], [2, "2"], [3, "3 · hardest"]], pl.level)}</label>
      <label>Hint order ${sel("pl-order", Object.entries(ORDER_LABEL), pl.hint_order)}</label>
      <label>Pictures per session ${sel("pl-n", [6, 8, 10, 12, 16, 20].map((v) => [v, v]), pl.pictures_per_session)}</label>
      <label>Tries before showing the word ${sel("pl-att", [[2, 2], [3, 3], [4, 4]], pl.max_attempts)}</label>
      <label>Break after missed pictures ${sel("pl-brk", [[2, "2 in a row"], [3, "3 in a row"], [4, "4 in a row"]], pl.break_after_misses)}</label>
      <label>Days per week ${sel("pl-days", [3, 4, 5, 6, 7].map((v) => [v, v]), pl.days_per_week)}</label>
    </div>
    <div class="small muted">Move up when: ${esc(pl.advance_rule)}. Goal: ${p.goal_minutes} minutes a week.</div>
    <div class="label">Personal words</div><div class="words">${pl.personal_words.map((w) => `<span class="word">${esc(w)}</span>`).join("")}</div>
  </div>`;
}

function applyChanges(p, items, who) {
  const show = (k, v) => k === "hint_order" ? ORDER_LABEL[v] : Array.isArray(v) ? v.join(", ") : v;
  for (const o of items) p.plan[o.key] = o.to;
  if (items.length) S.log[p.id].push({ when: "Nov 7", who, what: items.map((o) => `${o.why} (${show(o.key, o.from)} → ${show(o.key, o.to)}).`).join(" ") });
  if (S.run && S.tablet === p.id) S.run = null;
}
function wireClinician(p) {
  const fb = $("fb-text");
  document.querySelectorAll("[data-chip]").forEach((c) => (c.onclick = () => { fb.value = (fb.value ? fb.value.trim() + " " : "") + c.dataset.chip + "."; }));
  $("fb-go").onclick = () => { const text = fb.value.trim() || fb.placeholder.replace(/^For example: /, ""); S.proposal = { id: p.id, text, items: parseFeedback(p, text) }; renderClinician(); };
  const ap = $("fb-apply");
  if (ap) ap.onclick = () => {
    const items = S.proposal.items.filter((o, i) => document.querySelector(`[data-pi="${i}"]`).checked);
    applyChanges(p, items, "Dr. Patel, SLP (feedback)"); S.log[p.id][S.log[p.id].length - 1].what = `Note: “${S.proposal.text}” → ` + S.log[p.id][S.log[p.id].length - 1].what;
    S.proposal = null; renderClinician(); toast(items.length ? `Plan updated. ${p.first}'s next practice uses it.` : "Nothing selected.");
  };
  const cn = $("fb-cancel"); if (cn) cn.onclick = () => { S.proposal = null; renderClinician(); };
  const sv = $("fb-save"); if (sv) sv.onclick = () => { S.log[p.id].push({ when: "Nov 7", who: "Dr. Patel, SLP", what: `Note: “${S.proposal.text}”` }); S.proposal = null; renderClinician(); toast("Note saved."); };
  document.querySelectorAll(".sess button").forEach((b) => (b.onclick = () => { S.openSession = +b.dataset.s; renderClinician(); }));
  document.querySelectorAll(".over select").forEach((s) => (s.onchange = () => {
    if (!s.value) return;
    const i = S.openSession ?? p.sessions.length - 1, k = +s.dataset.k, t = p.sessions[i].trials[k];
    S.overrides[p.id].push({ s: i, k, from: t.hint, to: s.value, after: p.sessions[i].trials[k - 1].error });
    renderClinician(); toast(`Saved: ${HINT_LABEL[s.value]} instead of ${HINT_LABEL[t.hint]}.`);
  }));
  const te = $("teach"); if (te) te.onclick = () => {
    te.disabled = true; te.textContent = "Learning…";
    setTimeout(() => { S.taught[p.id] = true;
      if (p.teaching) { p.cue_after.wrong_word = p.teaching.cue_after_wrong_word_after; p.teaching.sessions_after.forEach((s, i) => p.sessions.push({ ...s, after: i + 1 })); S.openSession = null;
        S.log[p.id].push({ when: "Nov 7", who: "Dr. Patel, SLP (corrections)", what: `AI updated from ${S.overrides[p.id].length} corrections: ${p.teaching.rule.toLowerCase()}.` }); }
      renderClinician(); }, 900);
  };
  const map = { "pl-level": "level", "pl-order": "hint_order", "pl-n": "pictures_per_session", "pl-att": "max_attempts", "pl-brk": "break_after_misses", "pl-days": "days_per_week" };
  const why = { level: "Starting level", hint_order: "Hint order", pictures_per_session: "Pictures per session", max_attempts: "Tries before showing the word", break_after_misses: "Break after missed pictures", days_per_week: "Days per week" };
  for (const [id, key] of Object.entries(map)) $(id).onchange = (e) => {
    const v = key === "hint_order" ? e.target.value : +e.target.value;
    applyChanges(p, [{ key, from: p.plan[key], to: v, why: why[key] }], "Dr. Patel, SLP (plan)"); renderClinician(); toast("Plan updated.");
  };
}

/* ---------- boot ---------- */
const h = location.hash.slice(1);
if (h === "patient" || h === "clinician") S.view = h;
render();
</script>
