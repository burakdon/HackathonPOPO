# Gymnasium environment (envs/aphasia_env.py).

# Observation: the last `history` trials (one-hot tier, cue, error type, response time, present
# flag) plus current tier, rolling accuracy, fail streak and session progress, all computed from
# the State JSON only. The history stack gives the policy memory in this POMDP.
history: 8
nominal_trials: 40
rt_cap_s: 15.0

# Same clinical rule as the bandits (configs/logistic_bandit.yaml), so comparisons are like for
# like: a cue may only be offered right after an error. Enforced as part of the action mask.
cue_only_after_error: true
