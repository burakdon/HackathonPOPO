# Robustness checks (eval/robustness.py): out-of-distribution patients and scorer noise.
#   uv run python -m eval.robustness --config configs/robustness.yaml
seed: 0
n_patients: 200
bootstrap_samples: 1000
dropout: true
metrics: [time_in_band, control_error, learning_gain, probe_lift, probe_recall, quit, frustration_events]
oracle: {tolerance: 0.06, cue_cost: 0.03, tier_bonus: 0.01, cue_only_after_error: true}
policies:
  - {key: fixed, label: "fixed (tier 2)", type: fixed, tier: 2}
  - {key: staircase, label: "staircase", type: staircase}
  - {key: contextual_bandit, label: "contextual bandit", type: logistic_bandit}
  - {key: ppo_proxy, label: "PPO, proxy reward", type: ppo, models: [models/ppo_seed0.zip, models/ppo_seed1.zip, models/ppo_seed2.zip]}
  - {key: ppo_sim, label: "PPO, simulation objective", type: ppo, models: [models/ppo_privileged_seed0.zip, models/ppo_privileged_seed1.zip, models/ppo_privileged_seed2.zip]}
  - {key: oracle, label: "oracle (privileged)", type: oracle}

# Patients outside the training parameter ranges (configs/sim.yaml, ood_cohorts).
ood_cohorts: [ood_very_severe, ood_fast_fatigue, ood_semantic_responder]

# Scorer noise: the observed outcome is flipped with this probability (evaluation only).
noise_levels: [0.0, 0.05, 0.10]
noise_cohorts: [mild_anomic, moderate_broca, severe]
output_dir: results
