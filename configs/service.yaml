# FastAPI agent service. Paths are relative to the repo root.
# Live agent:
#   ppo              MaskablePPO trained on the simulation-only objective (default). It does not
#                    update its weights during a session; it reacts to the person through its
#                    observation history (last 8 trials). Seed 0 of the three trained seeds, chosen
#                    without looking at test results.
#   logistic_bandit  contextual Bayesian logistic Thompson sampling with the fitted prior; learns
#                    online per session (fallback).
#   beta_bandit      non-contextual Thompson sampling (simple fallback).
agent: ppo
ppo_model: models/ppo_privileged_seed0.zip
clinical_config: configs/clinical.yaml
bandit_config: configs/bandit.yaml
logistic_bandit_config: configs/logistic_bandit.yaml

# POST /learn_from_overrides: one DITTO-style round (with anchors) on this session's overrides,
# then hot-swap that session's PPO policy. Anchors = this session's accepted (not overridden)
# choices plus the base policy's own decisions on `anchor_pool_patients` validation patients
# (collected once, on the first call). Sized to finish in a few seconds on CPU.
# One round of 300 gradient steps at lr 0.002 moved P(first sound | after a sound error) from 0.09
# to 0.94 from 10 realistic overrides in ~0.3 s, leaving all other state types unchanged.
live_ditto:
  rounds: 1
  gradient_steps: 300
  learning_rate: 0.002
  beta: 0.5
  samples_per_state: 8
  anchor_weight: 5.0
  anchor_pool_patients: 30
  seed: 0

# Requests without a session_id share this session (backward compatibility with the original
# State JSON). The frontend should always send a session_id.
default_session_id: default

# Clinician overrides are appended here as JSON lines; this file is the DITTO training input.
# Lives under runs/ (gitignored) because it is produced during live demos.
overrides_path: runs/overrides.jsonl

# Origins allowed to call the service from a browser (Vite dev server defaults).
cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]

# Also allow a Vite dev server (port 5173) on any private-network address, so another laptop on
# the same Wi-Fi can call the service when it runs with --host 0.0.0.0. Set to null to disable.
# Trade-off: convenient for the demo; tighten to explicit origins for anything beyond a LAN.
cors_origin_regex: '^http://(localhost|127\.0\.0\.1|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+):5173$'
