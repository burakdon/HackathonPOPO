# Evaluation on the TWO-STEP patient model (sim/two_step.py). Run with the matching simulator:
#   SIM_CONFIG=configs/sim_two_step.yaml uv run python -m eval.compare --config configs/eval_two_step.yaml
# Same patients for every policy (common random numbers). "PPO, original model" was trained on the
# original single-score patients and is evaluated here zero-shot: it shows what training on the
# two-step definition adds. The contextual bandit's prior was fitted on the original model.
seed: 0
n_patients: 100                 # held-out TEST patients per cohort (never used in training or tuning)
cohorts: [mild_anomic, moderate_broca, moderate_semantic, severe]
dropout: true                   # patient dropout as in configs/sim.yaml (results with it off: ablations)
bootstrap_samples: 2000         # percentile bootstrap over patients, 95% intervals

# Policies, in the fixed order used for colours in the figures.
policies:
  - {key: fixed, label: "fixed (tier 2)", type: fixed, tier: 2}
  - {key: staircase, label: "staircase", type: staircase}
  - {key: contextual_bandit, label: "contextual bandit", type: logistic_bandit}
  - {key: ppo_original, label: "PPO, original model (zero-shot)", type: ppo, models: [models/ppo_seed0.zip, models/ppo_seed1.zip, models/ppo_seed2.zip]}
  - {key: ppo_two_step, label: "PPO, two-step model", type: ppo, models: [models/ppo_two_step_seed0.zip, models/ppo_two_step_seed1.zip, models/ppo_two_step_seed2.zip]}
  - {key: oracle, label: "oracle (privileged)", type: oracle}

# Oracle selection rule (same form as the bandits').
oracle: {tolerance: 0.06, cue_cost: 0.03, tier_bonus: 0.01, cue_only_after_error: true}

# Metrics reported (eval/metrics.py). `pct_of_oracle` metrics are also reported as % of the oracle.
metrics: [time_in_band, control_error, learning_gain, probe_recall, probe_lift, quit, frustration_events, mean_tier, accuracy]
pct_of_oracle: [learning_gain, probe_lift]

# Paired differences (A - B on the same patients), bootstrap 95% CI.
paired:
  - [ppo_two_step, ppo_original]
  - [ppo_two_step, fixed]
  - [ppo_two_step, contextual_bandit]
  - [ppo_two_step, oracle]

# Simplified slide figure (results/pitch_severe.png): one cohort, three policies, two metrics.
pitch:
  cohort: severe
  policies:
    - {key: fixed, label: "Fixed difficulty"}
    - {key: staircase, label: "Staircase"}
    - {key: ppo_two_step, label: "Our agent (two-step)"}

output_dir: results/two_step
