# DATA-GROUNDED two-step patient model: the two-step model (configs/sim_two_step.yaml) with
#   - the 175 Philadelphia Naming Test items and their MEASURED IRT difficulties (data/pnt_items.csv)
#   - a training population whose overall naming ability is drawn from 335 real people with aphasia
#     (data/pnt_thetas.csv; MAPPD and an R03 sample, as distributed with the PNT-CAT app)
# Source and licence notes: data/PNT_SOURCE.md. Use with  SIM_CONFIG=configs/sim_pnt.yaml
#
# Original header (two-step model):
# Two-step patient model (sim/two_step.py): aphasia as weakened links between meaning, words and
# sounds.
#
#   P1 = sigmoid(sem_strength  + gain + beta_frequency * z(freq)   + sem_resp  * stage1_cue - fatigue)
#   P2 = sigmoid(phon_strength + gain - beta_length    * z(length) + phon_resp * stage2_cue - fatigue)
#   p(correct) = P1 * P2; step-1 failures give meaning errors (or no response), step-2 failures give
#   sound errors (or no response, tip of the tongue).
#
# STRUCTURE from the literature: two steps with separate semantic (s) and phonological (p) link
# strengths that predict a patient's error types (Dell et al. 1997; Foygel & Dell 2000; Schwartz
# et al. 2006); frequency effects at word selection and length effects at phonological encoding
# (Nickels & Howard 1995); phonological cues act on phonological retrieval, semantic cues on
# semantic/lexical selection (Meteyard & Bose 2018). Every MAGNITUDE below is an ASSUMPTION, to be
# replaced by fits to real naming data (e.g. the Moss Aphasia Psycholinguistics Project Database).
#
# Everything not listed here (items, fatigue, learning peak, response time, dropout, probes,
# session, splits) is identical to configs/sim.yaml.

model: two_step
two_step:
  beta_frequency: 0.9          # step 1: common words are selected more easily
  beta_length: 0.6             # step 2: longer words are harder to encode phonologically
  # Cue weights per step (multiplied by the patient's sem_resp / phon_resp). First sound feeds
  # step 1 slightly too (feedback from sounds to words in the interactive model). ASSUMPTION: values.
  stage1_cue: {none: 0.0, first_sound: 0.25, first_letter: 0.1, sentence_frame: 0.7, semantic: 0.9}
  stage2_cue: {none: 0.0, first_sound: 1.3, first_letter: 0.7, sentence_frame: 0.2, semantic: 0.0}
  # Training population from real ability scores (sim/population.py ground_in_pnt). Evaluation
  # cohorts below stay parametric; scripts/calibrate_pnt.py reports where each sits among real patients.
  population_source: pnt
  thetas_path: data/pnt_thetas.csv
  theta_jitter: 2.0
  profile_beta: [2.0, 2.0]       # ASSUMPTION: share of failure on step 1; MAPPD error data could fit it

items:
  # The 175 Philadelphia Naming Test items. Difficulty = irt_slope * (b - mean b), with b the
  # published 1PL difficulty on the T-scale and irt_slope the published discrimination (0.182 per
  # T-point). Tiers are difficulty terciles. Pictures are not included (copyrighted test materials).
  path: data/pnt_items.csv
  irt_slope: 0.182
  # difficulty[i] = beta_frequency * (-z(frequency)) + beta_length * z(length), z-scored within the
  # bank so the units of `frequency` and `length` only need to be consistent.
  # Direction: lower frequency and longer words are named less accurately in aphasia
  # (Nickels & Howard 1995). ASSUMPTION: magnitudes, frequency weighted more than length.
  beta_frequency: 0.9
  beta_length: 0.5

cues:
  # Not used by the two-step model (it uses two_step.stage1_cue / stage2_cue); kept so the file
  # validates against the same schema.
  # cue_gain[cue] = phonemic_weight[cue] * phon_resp + semantic_weight[cue] * sem_resp, where
  # phon_resp / sem_resp are the patient's responsiveness to phonological / semantic cueing.
  # Direction: phonemic cues have larger immediate effects than semantic cues on average
  # (Meteyard & Bose 2018); responsiveness varies between patients (phonemic vs semantic
  # responders). ASSUMPTION: the per-cue weights below.
  phonemic_weight: {none: 0.0, first_sound: 1.0, first_letter: 0.5, sentence_frame: 0.3, semantic: 0.0}
  semantic_weight: {none: 0.0, first_sound: 0.0, first_letter: 0.0, sentence_frame: 0.5, semantic: 0.8}

fatigue:
  # fatigue <- fatigue * (1 - recovery) + rate * (1 + streak_gain * fail_streak), capped at `cap`.
  # ASSUMPTION: fatigue accumulates with time on task and faster during failure streaks, and
  # partially recovers every trial (rate and recovery are per-patient, sampled below).
  streak_gain: 0.5
  cap: 1.5

learning:
  # On a CORRECT trial, item_learning[i] += rate * h(p) * cue_factor, with h(p) = p^(a-1) (1-p)^b
  # normalised so that the EXPECTED gain per trial, p * h(p) = p^a (1-p)^b, peaks exactly at
  # `peak` = a / (a + b). `sharpness` = a + b controls how narrow the peak is.
  # ASSUMPTION (central; a learning-peak ablation is planned): where learning peaks. 0.85 mirrors the 85% rule
  # (Wilson et al. 2019), a theoretical result not shown for aphasia. The scaffold's rule
  # implicitly peaked at 0.5.
  peak: 0.85
  sharpness: 8.0
  # cue_factor = 1 - cue_discount * cue_strength / max_strength.
  # ASSUMPTION: successes with weaker cues teach more (effortful retrieval), per the project spec.
  cue_discount: 0.5
  # Fraction of each item-specific gain that spills over to general ability.
  # Direction: naming gains are largely item-specific with limited generalisation to untrained
  # items (Nickels 2002). ASSUMPTION: the value.
  generalisation: 0.05

errors:
  # Not used by the two-step model: error types follow from which step failed (sim/two_step.py).
  {}

response_time:
  # log RT ~ Normal(log(base_s) + difficulty_gain * (1 - p) + fatigue_gain * fatigue, sigma),
  # plus fail_extra_s on failures. ASSUMPTION: harder items and fatigue slow naming.
  base_s: 1.8
  difficulty_gain: 0.8
  fatigue_gain: 0.3
  sigma: 0.25
  fail_extra_s: 1.5
  # Fixed time per trial outside the response (picture, feedback), used for session_minutes.
  overhead_s: 6.0

dropout:
  # The patient quits mid-session with probability base + streak_gain * max(0, fail_streak - 2),
  # checked after every trial: 0% until 3 failures in a row, then 5%, 10%, 15%... per further failure.
  # Motivation: in home practice, repeated failure leads to frustration and stopping (project spec);
  # without this, a policy loses nothing from long failure streaks except the reward penalty.
  # ASSUMPTION (conservative, no literature magnitude): no quitting while the patient succeeds, and
  # even a 5-failure streak quits only 15% of the time per trial. Results are reported with dropout
  # on and off (scripts/sanity_table.py --dropout off).
  enabled: true
  base: 0.0
  streak_gain: 0.05

# Review probes (objective: better later naming WITHOUT hints). Every `every`-th trial, if an
# eligible item exists, the session revisits a previously practised item with no cue; the agent does
# not choose it. Eligible: practised earlier in this session (not as a probe) and not shown in the
# last `min_gap` trials. Choice: fewest probes so far this session, then the item first practised
# earliest. Probe trials count toward n_trials and are scored like any other trial.
review_probes:
  enabled: true
  every: 5
  min_gap: 3

session:
  n_trials: 40
  # ASSUMPTION: sessions start on the easiest tier (low-error start), so adaptive agents must earn
  # progression. Fixed-difficulty baselines are unaffected (tier 2 is one step from tier 1).
  start_tier: 1

# Patient parameters, each Normal(mean, sd) truncated to [low, high]. ASSUMPTION: all values.
# Cohort centres are set so overall accuracy is close to the original model's cohorts, while the
# SOURCE of failure differs: which step is weak decides the error types and which cues help.
parameters: [sem_strength, phon_strength, sem_resp, phon_resp, omission_bias, tot_rate,
             fatigue_rate, fatigue_recovery, learn_rate]

population:
  # Broad training distribution: s and p drawn independently, so the agent meets every profile.
  sem_strength:     {mean: 1.7, sd: 1.0, low: -1.0, high: 4.0}
  phon_strength:    {mean: 1.7, sd: 1.0, low: -1.0, high: 4.0}
  sem_resp:         {mean: 1.0, sd: 0.35, low: 0.2, high: 2.0}
  phon_resp:        {mean: 1.0, sd: 0.35, low: 0.2, high: 2.0}
  omission_bias:    {mean: 0.45, sd: 0.2, low: 0.05, high: 0.9}
  tot_rate:         {mean: 0.3, sd: 0.15, low: 0.05, high: 0.8}
  fatigue_rate:     {mean: 0.012, sd: 0.006, low: 0.002, high: 0.04}
  fatigue_recovery: {mean: 0.06, sd: 0.03, low: 0.01, high: 0.2}
  learn_rate:       {mean: 0.15, sd: 0.06, low: 0.03, high: 0.35}

presets:
  # Mild anomic aphasia: word-finding difficulty (step 1 mildly weak), sounds intact; failures are
  # mostly omissions and meaning errors.
  mild_anomic:
    sem_strength:     {mean: 2.4, sd: 0.3, low: 1.6, high: 3.5}
    phon_strength:    {mean: 3.2, sd: 0.3, low: 2.4, high: 4.0}
    sem_resp:         {mean: 1.0, sd: 0.2, low: 0.4, high: 2.0}
    phon_resp:        {mean: 1.0, sd: 0.2, low: 0.4, high: 2.0}
    omission_bias:    {mean: 0.6, sd: 0.08, low: 0.2, high: 0.9}
    tot_rate:         {mean: 0.3, sd: 0.08, low: 0.05, high: 0.6}
    fatigue_rate:     {mean: 0.008, sd: 0.002, low: 0.002, high: 0.02}
    fatigue_recovery: {mean: 0.08, sd: 0.02, low: 0.02, high: 0.2}
    learn_rate:       {mean: 0.18, sd: 0.04, low: 0.05, high: 0.35}
  # Moderate phonological impairment (Broca's / conduction-like): step 2 weak; sound errors dominate
  # and phonemic cues help most.
  moderate_broca:
    sem_strength:     {mean: 2.4, sd: 0.3, low: 1.6, high: 3.5}
    phon_strength:    {mean: 0.9, sd: 0.3, low: 0.0, high: 1.8}
    sem_resp:         {mean: 0.8, sd: 0.2, low: 0.2, high: 1.6}
    phon_resp:        {mean: 1.2, sd: 0.2, low: 0.5, high: 2.0}
    omission_bias:    {mean: 0.35, sd: 0.08, low: 0.05, high: 0.7}
    tot_rate:         {mean: 0.2, sd: 0.06, low: 0.05, high: 0.5}
    fatigue_rate:     {mean: 0.012, sd: 0.003, low: 0.004, high: 0.03}
    fatigue_recovery: {mean: 0.06, sd: 0.015, low: 0.02, high: 0.15}
    learn_rate:       {mean: 0.15, sd: 0.04, low: 0.05, high: 0.3}
  # Moderate semantic impairment (new cohort): step 1 weak, sounds intact; meaning errors dominate
  # and cues that feed word selection (semantic, sentence frame) help most.
  moderate_semantic:
    sem_strength:     {mean: 0.9, sd: 0.3, low: 0.0, high: 1.8}
    phon_strength:    {mean: 2.8, sd: 0.3, low: 2.0, high: 4.0}
    sem_resp:         {mean: 1.2, sd: 0.2, low: 0.5, high: 2.0}
    phon_resp:        {mean: 0.8, sd: 0.2, low: 0.2, high: 1.6}
    omission_bias:    {mean: 0.3, sd: 0.08, low: 0.05, high: 0.7}
    tot_rate:         {mean: 0.3, sd: 0.08, low: 0.05, high: 0.6}
    fatigue_rate:     {mean: 0.012, sd: 0.003, low: 0.004, high: 0.03}
    fatigue_recovery: {mean: 0.06, sd: 0.015, low: 0.02, high: 0.15}
    learn_rate:       {mean: 0.15, sd: 0.04, low: 0.05, high: 0.3}
  # Severe aphasia: both steps weak; mostly no response; fatigues fastest.
  severe:
    sem_strength:     {mean: 0.3, sd: 0.3, low: -1.0, high: 1.2}
    phon_strength:    {mean: 0.2, sd: 0.3, low: -1.0, high: 1.2}
    sem_resp:         {mean: 0.9, sd: 0.2, low: 0.2, high: 1.8}
    phon_resp:        {mean: 1.1, sd: 0.25, low: 0.3, high: 2.0}
    omission_bias:    {mean: 0.7, sd: 0.08, low: 0.3, high: 0.9}
    tot_rate:         {mean: 0.5, sd: 0.1, low: 0.2, high: 0.8}
    fatigue_rate:     {mean: 0.018, sd: 0.004, low: 0.006, high: 0.04}
    fatigue_recovery: {mean: 0.05, sd: 0.015, low: 0.01, high: 0.12}
    learn_rate:       {mean: 0.12, sd: 0.04, low: 0.03, high: 0.25}

# Splits: patients are generated from SeedSequence([root_seed, split_id, cohort, index]), so the
# populations are disjoint random streams by construction. `val` is used only for learning curves
# and model selection during training; `test` only for final evaluation.
splits: {train: 0, test: 1, val: 2}
